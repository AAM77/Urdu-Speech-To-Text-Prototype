name: ${COMPOSE_PROJECT_NAME:-urdu-pipeline}

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: urdu-pipeline-api:local
    init: true
    command:
      - uvicorn
      - urdu_pipeline.api.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      PIPELINE_PROVIDER_MODE: ${PIPELINE_PROVIDER_MODE:-fake}
      OUTPUT_ROOT: ${OUTPUT_ROOT:-/app/runs}
      CACHE_ROOT: ${CACHE_ROOT:-/app/.cache_pipeline}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PROMPT_VERSION: ${PROMPT_VERSION:-v1}
      DATABASE_URL: ${DATABASE_URL:-postgresql://urdu_pipeline:urdu_pipeline_local_password@postgres:5432/urdu_pipeline}
      SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN:-local_processor_dev_token_change_me}
      OBJECT_STORE_ENDPOINT_URL: ${OBJECT_STORE_ENDPOINT_URL:-http://minio:9000}
      OBJECT_STORE_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-urdu-pipeline-local}
      OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:-local}
      OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:-urdu_pipeline}
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-urdu_pipeline_local_password}
      AWS_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY:-urdu_pipeline}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_KEY:-urdu_pipeline_local_password}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  processor:
    build:
      context: .
      dockerfile: Dockerfile.processor
    image: urdu-pipeline-processor:local
    init: true
    command:
      - sh
      - -c
      - |
        urdu-pipeline process --api-url http://api:8000 --dry-run
        touch /tmp/processor-ready
        exec python -c "import time; time.sleep(31536000)"
    environment:
      PIPELINE_PROVIDER_MODE: ${PIPELINE_PROVIDER_MODE:-fake}
      OUTPUT_ROOT: ${OUTPUT_ROOT:-/app/runs}
      CACHE_ROOT: ${CACHE_ROOT:-/app/.cache_pipeline}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PROMPT_VERSION: ${PROMPT_VERSION:-v1}
      DATABASE_URL: ${DATABASE_URL:-postgresql://urdu_pipeline:urdu_pipeline_local_password@postgres:5432/urdu_pipeline}
      SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN:-local_processor_dev_token_change_me}
      PROCESSOR_API_URL: ${PROCESSOR_API_URL:-http://api:8000}
      OBJECT_STORE_ENDPOINT_URL: ${OBJECT_STORE_ENDPOINT_URL:-http://minio:9000}
      OBJECT_STORE_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-urdu-pipeline-local}
      OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:-local}
      OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:-urdu_pipeline}
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-urdu_pipeline_local_password}
      AWS_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY:-urdu_pipeline}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_KEY:-urdu_pipeline_local_password}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/processor-ready && ffprobe -version >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-urdu_pipeline}
      POSTGRES_USER: ${POSTGRES_USER:-urdu_pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urdu_pipeline_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-urdu_pipeline}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-urdu_pipeline_local_password}
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  reverse-proxy:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    ports:
      - "${REVERSE_PROXY_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres_data:
  minio_data:
  redis_data:
